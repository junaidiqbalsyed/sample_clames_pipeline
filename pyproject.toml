[project]
name = "smart-clames"
version = "0.1.0"
description = "Smart-claims lakehouse: telematics simulator, Azure SQL source data and Databricks Lakeflow pipeline"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "azure-eventhub>=5.15.1",
    "azure-identity>=1.27.0",
    "mssql-python>=1.17.0",
    "pillow>=13.0.0",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["data", "src/sample_clames_pipeline"]   # pipeline files use Databricks-injected globals (spark)

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E402", "B008", "B905", "B007", "E731", "F841"]
